name: Build and release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package installer
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: synapse-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Synapse Browser ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" release/*.exe release/*.blockmap release/latest.yml --clobber
