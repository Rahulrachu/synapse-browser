name: Release validation

on:
  push:
    branches: [master, 'productization/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            package_command: dist:win
          - os: macos-latest
            platform: mac
            package_command: dist:mac
          - os: ubuntu-22.04
            platform: linux
            package_command: dist:linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and subsystem tests
        run: pnpm test --run

      - name: Build
        run: pnpm build

      - name: Package ${{ matrix.platform }}
        run: pnpm run ${{ matrix.package_command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Windows packaged UI smoke
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $executable = Join-Path $pwd 'release\\win-unpacked\\Synapse Browser.exe'
          if (-not (Test-Path $executable)) { throw "Packaged executable not found: $executable" }
          $process = Start-Process -FilePath $executable -ArgumentList '--no-sandbox', '--disable-gpu', '--remote-debugging-port=9222' -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) { throw "Synapse Browser exited during Windows launch smoke with code $($process.ExitCode)" }
            $env:ELECTRON_CDP = 'http://127.0.0.1:9222'
            $env:SMOKE_OUTPUT = 'artifacts/windows-smoke'
            pnpm exec node scripts/electron-interaction-smoke.mjs
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synapse-browser-${{ matrix.platform }}-${{ github.sha }}
          path: release/**
          if-no-files-found: error
          retention-days: 14
