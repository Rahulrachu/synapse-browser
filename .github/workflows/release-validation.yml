name: Release validation

on:
  push:
    branches: [master, 'productization/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            package_command: dist:win
          - os: macos-latest
            platform: mac
            package_command: dist:mac
          - os: ubuntu-22.04
            platform: linux
            package_command: dist:linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and subsystem tests
        run: pnpm test --run

      - name: Build
        run: pnpm build

      - name: Package ${{ matrix.platform }}
        run: pnpm run ${{ matrix.package_command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Windows packaged native UI smoke
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./scripts/windows-ui-smoke.ps1

      - name: Upload Windows UI evidence
        if: always() && matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-evidence
          path: artifacts/windows-smoke

      - name: Upload Windows installer to v1.0.5 release
        if: matrix.platform == 'win' && github.ref == 'refs/heads/productization/v1.0.5'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -Path release -Filter '*-Windows-*-Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer artifact was not produced' }
          gh release upload v1.0.5 $installer.FullName --repo Rahulrachu/synapse-browser --clobber

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synapse-browser-${{ matrix.platform }}-${{ github.sha }}
          path: release/**
          if-no-files-found: error
          retention-days: 14
