name: Clean up old artifacts
on:
  workflow_dispatch:
permissions:
  actions: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          n=0
          for id in $ids; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"; n=$((n+1)); done
          echo "Deleted $n artifacts"
